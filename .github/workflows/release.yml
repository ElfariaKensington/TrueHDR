name: Build & Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (uncheck for build-only artifact)'
        required: true
        type: boolean
        default: true
      tag:
        description: 'Tag name (leave blank to auto-generate next vX.Y.Z)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Release title (leave blank to auto-generate)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      title: ${{ steps.resolve.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag and release name
        id: resolve
        run: |
          BASE_VER=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            IFS='.' read -r MAJ MIN PAT <<< "$BASE_VER"
            PAT="${PAT:-0}"
            while git rev-parse -q --verify "refs/tags/v${MAJ}.${MIN}.${PAT}" >/dev/null; do
              PAT=$((PAT + 1))
            done
            TAG="v${MAJ}.${MIN}.${PAT}"
          fi
          TITLE="${{ inputs.release_name }}"
          if [ -z "$TITLE" ]; then
            TITLE="TrueHDR ${TAG} (Safari & Chrome)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG title=$TITLE"

  build-safari:
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout safari branch
        uses: actions/checkout@v4

      - name: Generate project.pbxproj for Xcode 26
        if: ${{ !hashFiles('xcode/TrueHDR/TrueHDR.xcodeproj/project.pbxproj') }}
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          rm -f xcode/TrueHDR/TrueHDR.xcodeproj/project.xcproj
          xcodegen generate --spec xcode/TrueHDR/project.yml --project xcode/TrueHDR

      - name: Build TrueHDR (Release)
        run: |
          xcodebuild \
            -project xcode/TrueHDR/TrueHDR.xcodeproj \
            -scheme TrueHDR \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Safari app
        run: |
          ZIP="TrueHDR-${{ needs.meta.outputs.tag }}-Safari-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/TrueHDR.app \
            "$ZIP"
          shasum -a 256 "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload Safari artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueHDR-${{ needs.meta.outputs.tag }}-Safari-macOS
          path: ${{ env.ZIP }}

  build-chrome:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chrome branch
        uses: actions/checkout@v4
        with:
          ref: chrome

      - name: Package Chrome extension
        run: |
          ZIP="TrueHDR-${{ needs.meta.outputs.tag }}-Chrome.zip"
          (cd extension && zip -r "../$ZIP" . -x '*.DS_Store')
          sha256sum "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueHDR-${{ needs.meta.outputs.tag }}-Chrome
          path: ${{ env.ZIP }}

  release:
    needs: [meta, build-safari, build-chrome]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--generate-notes --title "${{ needs.meta.outputs.title }}" --target "${{ github.sha }}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${{ needs.meta.outputs.tag }}" dist/*.zip "${FLAGS[@]}"
